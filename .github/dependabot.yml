version: 2
updates:
  # npm: each standalone tool in tools/* - all four carry their own package.json AND
  # package-lock.json, so npm_and_yarn can genuinely update them. The ROOT is deliberately
  # absent from `directories`; see the note below the grouping rationale.
  #
  # Grouping matters here: before this file existed, the repo had NO Dependabot
  # config at all, so only GitHub's *security* updates fired — one ungrouped PR
  # per advisory, opened at whatever hour the advisory landed. Those PRs then sat
  # open, and every subsequent security job for the same dependency+version
  # aborted with `pull_request_exists_for_security_update`, which GitHub reports
  # as a hard *failure* of the "Dependabot Updates" run. Grouped weekly version
  # updates keep the dependency floor high enough that far fewer advisories ever
  # become actionable in the first place.
  #
  # THIS REPO DROPPED THE ROOT FROM `directories`; it did not lose the whole entry, because
  # tools/* works and the root does not. The abort below happens during FILE FETCHING for the
  # WHOLE JOB, so while "/" was listed all four tools/* updaters were dead collateral - the job
  # failed before fetching any directory. Removing "/" RE-ENABLES four working updaters.
  #
  # (The former note here said "No package-lock.json is committed". That was pasted from a
  # sibling repo and was never true of this one - all four tools/* carry one, as the comment at
  # the top of this entry says. Removed rather than carried forward.)
  #
  # NO DEPENDENCY-UPDATE ECOSYSTEM WORKS FOR A BUN-MANAGED DIRECTORY. Both options fail and each
  # error recommends the other, so the entry was REMOVED rather than left failing weekly:
  #   bun -> "Unsupported bun.lock 'lockfileVersion' 2" - its bundled bun reads v1, Bun 1.4 writes v2.
  #   npm -> "npm_and_yarn ecosystem cannot update bun.lock. Set package-ecosystem: bun" - this
  #          aborts during FILE FETCHING, so nothing is proposed for ANY directory in the entry.
  # npm_and_yarn worked until upstream added that abort between 2026-09-23 and 2026-09-25.
  # COST: security ALERTS still fire (they are dependency-graph based) but nothing proposes the
  # fix, so "0 open Dependabot PRs" now partly means "Dependabot cannot open one". A bump is a
  # human action: `bun outdated`, then `bun update <pkg>`, then commit the regenerated bun.lock.
  # REVISIT, and it is checkable: re-add `package-ecosystem: bun` once its bundled bun reads
  # lockfileVersion 2. Set it, watch ONE scheduled run - the failure is immediate and costs nothing.
  # Do NOT pin Bun back to 1.3.14 for a v1 lockfile: that downgrades the toolchain around a vendor bug.
  - package-ecosystem: "npm"
    directories:
      - "/tools/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    versioning-strategy: increase
    groups:
      # One PR per week for everything routine. Majors stay ungrouped so they
      # get individual review — they are the ones that break builds.
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"
