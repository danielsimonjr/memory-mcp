name: TypeScript

on:
  push:
    branches:
      - main
  pull_request:
  # A Dependabot PR auto-merged by dependabot-auto-merge.yml is pushed with GITHUB_TOKEN, and
  # GitHub's recursion guard suppresses workflow triggers for those pushes -- so `main`
  # can carry a dependency commit with no run at all (bc341764 did). The PR gate still
  # held, but main's own history goes dark. A nightly run re-exercises main regardless of
  # who pushed it, and workflow_dispatch lets a gap be backfilled on the spot.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# This package is a single TypeScript package at the repository root. The
# previous detect-packages/matrix template scanned src/ for nested
# package.json manifests (none exist), so the Build/Publish matrix expanded
# empty and the run concluded failure. Replaced with a direct single-package
# pipeline. (bun install --frozen-lockfile

# Pinned explicitly rather than inheriting the repository default. The default is
# `read` today, but it is a repo-level setting any future change can widen silently;
# this job only checks out and builds, so it never needs more than read.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the PRODUCTION platform for this MCP server (Daniel runs it
        # locally on Windows); CI was Linux-only, so it never tested the OS the
        # server actually ships on.
        os: [ubuntu-latest, windows-latest]
        # Node 20 reached EOL 2026-04 and, critically, better-sqlite3 (pulled in via
        # @danielsimonjr/memoryjs) ships NO Windows prebuild for its ABI — so `bun install --frozen-lockfile
        # cannot even install on windows+node20 (it falls back to node-gyp and fails).
        # Supporting a runtime the package cannot install on is not support.
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      # The plugin runs the committed bundle, not dist/. A bundle that nobody rebuilt keeps its old version.
      # This step runs before the install, like the same step in publish.yml, so the bundle must start without node_modules.
      - name: Committed bundle reports the version of package.json
        run: bun run check:bundle
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The version check above cannot see a bundle that lags the source. This step builds the bundle again
      # and compares it with the committed file. It needs the installed dependencies.
      - name: Committed bundle equals a fresh build
        run: bun run check:bundle-content
      - name: Type check
        run: bun run typecheck
      # tsconfig.json excludes tests, and vitest strips types, so only this step reads a type error in a test file.
      - name: Type check the test files
        run: bun run typecheck:tests
      - name: Build
        run: bun run build
      # The npm tarball must hold no build file without a source. `tsc` never deletes old output,
      # and 150 such files shipped in every release from 12.7.0 to 12.9.0.
      - name: Pack list holds no file without a source
        run: bun run check:pack
      - name: Node runtime smoke (the shipped artifact must load under Node)
        run: |
          node --input-type=module -e '
            const entry = "./dist/index.js";
            const t = setTimeout(() => { console.log("PASS: self-started under Node"); process.exit(0); }, 5000);
            import(entry).then(() => { clearTimeout(t); console.log("PASS: loaded cleanly under Node"); process.exit(0); })
              .catch((e) => { clearTimeout(t); console.error("FAIL: " + entry + " -> " + e.message); process.exit(1); });
          '
      - name: Test
        run: bun run test
        env:
          SKIP_BENCHMARKS: '1'

  # Non-required on purpose. No other job reads the architecture documents, so a claim that drifts
  # from the source turns no check red. This job reads the committed documents against the committed
  # source and writes nothing. It needs no Bun and no `bun install`: the command runs on a bare
  # checkout. The version is pinned in one place, so a new release of `repo-tools` cannot turn this
  # check red on its own. Raise the pin in a pull request that also re-measures the documents. This
  # job does not change branch protection. The check name says non-required so a reader does not
  # mistake it for one of the required contexts.
  architecture-docs-claims:
    name: architecture-docs claims (non-required)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      REPO_TOOLS_VERSION: '2.3.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the pinned repo-tools
        run: npm install --global @danielsimonjr/repo-tools@${REPO_TOOLS_VERSION}
      - name: Fail when an architecture document claim no longer matches the source
        run: repo-tools check . --docs=docs/architecture
